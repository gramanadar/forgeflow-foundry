<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeFlow — From Idea to Production</title><style>
:root{--bg:#100b10;--panel:#1c1119;--panel2:#261720;--panel3:#301b27;--line:#50303d;--text:#fff5f7;--muted:#bca6b0;--red:#e74b62;--red2:#a92942;--pink:#ff9aaa;--green:#70d8aa;--gold:#f4c977;--blue:#9abcf8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:3px}.shell{min-height:100vh}.top{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,68px);border-bottom:1px solid var(--line);background:#160d14ee;position:sticky;top:0;z-index:10;backdrop-filter:blur(18px)}.logo{font-size:24px;font-weight:850;letter-spacing:-1.2px}.logo span{color:var(--red)}.logo:before{content:'◈';color:var(--red);font-size:27px;margin-right:10px}.nav{display:flex;align-items:center;gap:23px}.nav a{font-size:13px;color:#d6c0ca}.nav a:hover,.nav a.active{color:white}.btn{border:1px solid #845060;background:transparent;color:white;padding:11px 18px;border-radius:9px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:linear-gradient(120deg,#bf304b,#e45167);border-color:#d84b60;box-shadow:0 6px 22px #bc284638}.btn:hover{filter:brightness(1.16)}.btn.small{padding:8px 13px}.btn.ghost{border-color:transparent}.hamb{display:none}.container{max-width:1220px;margin:auto;padding:0 28px}.hero{padding:100px 0 78px;background:radial-gradient(ellipse at 80% 30%,#5c1b36 0,transparent 42%),radial-gradient(ellipse at 5% 80%,#321725 0,transparent 38%)}.hero-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:48px;align-items:center}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.19em;text-transform:uppercase;color:var(--pink)}h1{font-size:clamp(42px,5.5vw,76px);line-height:1.07;letter-spacing:-3.2px;margin:17px 0 23px}h1 em,h2 em{font-style:normal;color:var(--red)}h2{font-size:clamp(28px,3.3vw,45px);letter-spacing:-1.5px;line-height:1.14;margin:14px 0}h3{font-size:19px;margin:8px 0 10px}p{color:var(--muted)}.lead{font-size:18px;max-width:660px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:29px}.tag,.pill{font-size:11px;border:1px solid #724051;background:#321a29;border-radius:30px;padding:6px 11px;color:#f4bfcb}.pill.green{color:var(--green);border-color:#3b6b58;background:#1b352d}.pill.gold{color:var(--gold);border-color:#65522f;background:#342b1c}.pill.blue{color:var(--blue);border-color:#405878;background:#202d41}.mock{border:1px solid #794257;border-radius:18px;background:#1a1019;box-shadow:0 25px 80px #0009;overflow:hidden}.mock-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#874357}.dots i:first-child{background:#ec5e6b}.dots i:nth-child(2){background:#efc273}.dots i:last-child{background:#6ecf9c}.mock-body{padding:22px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.metric{background:#2a1924;border:1px solid #593140;border-radius:12px;padding:15px}.metric strong{display:block;font-size:25px}.muted,.metric small{color:var(--muted);font-size:12px}.track{display:flex;gap:6px;margin:18px 0}.track i{height:7px;border-radius:20px;background:#4e293a;flex:1}.track i.done{background:var(--red)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.wrap{flex-wrap:wrap}.section{padding:82px 0}.section.alt{background:#160e16}.section-head{max-width:740px;margin-bottom:32px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(160deg,#291722,#1a111a);border:1px solid #553040;border-radius:15px;padding:25px;min-width:0}.card p{font-size:14px}.card .ico{display:grid;place-items:center;width:42px;height:42px;background:#512034;color:#ff9ba8;border-radius:11px;font-size:23px;margin-bottom:16px}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.flow .card{padding:16px}.flow b{font-size:12px}.flow .num{color:var(--pink);font-weight:800}.callout{background:linear-gradient(115deg,#5d1b34,#25131e);border:1px solid #87415b;border-radius:20px;padding:40px}.footer{padding:40px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer-grid{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:25px}.footer a{display:block;color:#c7adb9;margin:8px 0}.footer b{color:white}.page-hero{padding:72px 0 34px;background:radial-gradient(ellipse at 80% 10%,#411b2e,transparent 55%)}.page-hero h1{font-size:clamp(38px,4vw,60px)}.prose{max-width:800px}.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.pricegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.price{padding:28px;background:#23151f;border:1px solid #633648;border-radius:18px}.price.featured{border-color:var(--red);background:#351927}.price .amount{font-size:32px;font-weight:850}.price ul{padding-left:18px;color:#d7c4cd;font-size:13px;line-height:2}.notice{border-left:3px solid var(--red);padding:14px 20px;background:#301a27;color:#eed5de;border-radius:4px;font-size:13px}.formbox{background:#24151f;border:1px solid #5b3445;border-radius:16px;padding:28px;max-width:750px}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-size:12px;color:#ebd2dd;font-weight:700}.field input,.field textarea,.field select,.search{width:100%;background:#140d14;border:1px solid #624052;color:white;border-radius:9px;padding:12px 13px;outline:none}.field textarea{min-height:130px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red)}.faq{border-bottom:1px solid var(--line);padding:15px 0}.faq summary{cursor:pointer;font-weight:700}.faq p{margin:10px 0}.app-layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 74px)}.sidebar{border-right:1px solid var(--line);background:#170e16;padding:25px 13px;position:sticky;top:74px;height:calc(100vh - 74px);overflow:auto}.sidebar .group{font-size:10px;color:#8e7682;letter-spacing:.14em;text-transform:uppercase;padding:22px 12px 9px;font-weight:800}.sidebar a{display:block;padding:10px 13px;border-radius:8px;font-size:13px;color:#c9b4bf;margin:3px 0}.sidebar a:hover,.sidebar a.active{background:#4b2134;color:white}.appmain{padding:38px clamp(20px,3.4vw,56px);min-width:0;max-width:1500px;width:100%;margin:auto}.appmain h1{font-size:35px;letter-spacing:-1px;margin:6px 0 10px}.appmain .sub{margin:0 0 26px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{background:#23151e;border:1px solid #4c2c3c;border-radius:12px;padding:19px}.stat .big{font-size:30px;font-weight:800}.stat .caption{font-size:12px;color:var(--muted)}.panel{background:#21141d;border:1px solid #523040;border-radius:14px;padding:22px;margin:17px 0;overflow:auto}.panel h3{margin:0 0 14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:660px}th{text-align:left;color:#bda3af;font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:13px 12px;border-bottom:1px solid #593747}td{font-size:13px;padding:15px 12px;border-bottom:1px solid #402633}tr:hover td{background:#2b1824}.link{color:#ff91a2;cursor:pointer}.split{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}.timeline{border-left:2px solid #663448;margin-left:9px;padding-left:23px}.event{position:relative;padding:0 0 23px}.event:before{content:'';position:absolute;width:10px;height:10px;background:var(--red);border-radius:50%;left:-29px;top:6px}.event small{color:var(--muted)}.progress{height:8px;border-radius:20px;background:#422435;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#b12e49,#f16b7b)}.kanban{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:13px;overflow:auto}.kanban .column{background:#190f18;border:1px solid #503040;border-radius:12px;padding:14px}.kanban .task{background:#30202b;border:1px solid #634052;border-radius:9px;padding:12px;margin:12px 0;font-size:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0}.tabs button{border:1px solid #5d394a;border-radius:8px;padding:8px 14px;background:#271823;color:#d6bfca}.tabs button.active{background:#a82e48;color:white}.code{background:#100c12;border:1px solid #513040;border-radius:10px;padding:17px;overflow:auto;color:#ffc0cd;font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap}.hidden{display:none!important}.toast{position:fixed;right:25px;bottom:25px;z-index:100;background:#432038;border:1px solid #bf5a72;padding:15px 20px;border-radius:12px;box-shadow:0 10px 40px #0009;max-width:360px}.mobile-nav{display:none}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:1000px){.nav{gap:12px}.nav a{font-size:12px}.hero-grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:repeat(3,1fr)}.statgrid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:740px){.top{height:65px}.nav{display:none}.hamb{display:block;background:transparent;color:white;border:1px solid #704052;border-radius:8px;padding:7px 11px}.mobile-nav.open{display:flex;position:fixed;top:65px;left:0;right:0;z-index:20;background:#241420;border-bottom:1px solid var(--line);padding:20px;flex-direction:column;gap:14px}.mobile-nav a{padding:6px}.hero{padding:65px 0}.container{padding:0 20px}.cards,.steps,.pricegrid,.footer-grid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}.app-layout{display:block}.sidebar{position:static;height:auto;display:flex;overflow:auto;gap:5px;padding:10px}.sidebar .group{display:none}.sidebar a{white-space:nowrap}.appmain{padding:24px 17px}.statgrid{grid-template-columns:repeat(2,1fr)}.metric-grid{grid-template-columns:1fr}h1{letter-spacing:-1.8px}}
</style></head><body><div id="root"></div><script>
const routes={home:'Home',product:'Platform',how:'How it works',solutions:'Solutions',security:'Security',pricing:'Pricing',docs:'Documentation',about:'About',contact:'Contact',login:'Sign in',signup:'Get started',dashboard:'Overview',projects:'Projects',newproject:'New project',opportunities:'Opportunities',requirements:'Requirements',architecture:'Architecture',agents:'Agent runs',tasks:'Delivery board',verification:'Verification',integrations:'Integrations',releases:'Deployments',monitoring:'Monitoring',approvals:'Approvals',artifacts:'Artifacts',costs:'Costs & usage',settings:'Settings',help:'Help center'};
const appRoutes=['dashboard','projects','newproject','opportunities','requirements','architecture','agents','tasks','verification','integrations','releases','monitoring','approvals','artifacts','costs','settings'];
const menuGroups=[['Workspace',['dashboard','projects','newproject','opportunities']],['Engineering',['requirements','architecture','agents','tasks','verification','integrations']],['Delivery',['releases','monitoring','approvals','artifacts']],['Account',['costs','settings','help']]];
const state={project:'Customer Support AI Assistant',period:'month',filter:'All',tab:'Summary',newProjects:[],approved:[],requests:[],contact:[],demoRuns:0};
const projects=[{name:'Customer Support AI Assistant',type:'RAG + CRM integration',stage:'Verification',progress:76,health:'On track',owner:'Demo workspace'},{name:'Inventory Sync API',type:'FastAPI + PostgreSQL',stage:'Architecture',progress:34,health:'Needs review',owner:'Demo workspace'},{name:'Client Portal',type:'React + API',stage:'Staging',progress:91,health:'On track',owner:'Demo workspace'}];
const opportunities=[['AI knowledge assistant + CRM integration','$3,000–$6,000','92','High'],['FastAPI service with OAuth and Postgres','$1,500–$3,500','88','High'],['Test automation for SaaS API','$800–$2,000','84','Medium']];
function go(r){location.hash='#/'+r;window.scrollTo(0,0)}function current(){return(location.hash.split('/')[1]||'home').split('?')[0]}function btn(label,r,cls='primary'){return `<button class="btn ${cls}" onclick="go('${r}')">${label}</button>`}function badge(s){return `<span class="pill ${/pass|ready|track|approved|complete/i.test(s)?'green':/pending|review|blocked/i.test(s)?'gold':'blue'}">${s}</span>`}function icon(i){return `<div class="ico">${i}</div>`}function card(i,title,desc){return `<div class="card">${icon(i)}<h3>${title}</h3><p>${desc}</p></div>`}function pageHero(k,title,desc){return `<div class="page-hero"><div class="container"><div class="eyebrow">${k}</div><h1>${title}</h1><p class="lead">${desc}</p></div></div>`}function footer(){return `<footer class="footer"><div class="container footer-grid"><div><div class="logo">Forge<span>Flow</span></div><p>From idea to production.<br>Supervised, evidence-backed AI software delivery.</p><small>© 2026 ForgeFlow · Concept prototype</small></div><div><b>Product</b><a href="#/product">Platform</a><a href="#/how">How it works</a><a href="#/pricing">Pricing</a></div><div><b>Resources</b><a href="#/docs">Documentation</a><a href="#/security">Security</a><a href="#/help">Help</a></div><div><b>Company</b><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/login">Sign in</a></div></div></footer>`}function header(r){return `<header class="top"><a class="logo" href="#/home">Forge<span>Flow</span></a><nav class="nav">${['product','how','solutions','security','pricing','docs'].map(k=>`<a class="${r===k?'active':''}" href="#/${k}">${routes[k]}</a>`).join('')}<a href="#/login">Sign in</a>${btn('Launch workspace →','dashboard','primary small')}</nav><button class="hamb" onclick="document.querySelector('.mobile-nav').classList.toggle('open')">☰</button></header><nav class="mobile-nav">${['product','how','solutions','security','pricing','docs','login','dashboard'].map(k=>`<a href="#/${k}" onclick="document.querySelector('.mobile-nav').classList.remove('open')">${routes[k]}</a>`).join('')}</nav>`}function publicLayout(r,html){return `${header(r)}<main>${html}</main>${footer()}`}
function home(){return `<section class="hero"><div class="container hero-grid"><div><div class="eyebrow">THE AI-NATIVE SOFTWARE DELIVERY PLATFORM</div><h1>From idea to <em>production.</em></h1><p class="lead">ForgeFlow coordinates specialized AI engineering agents to turn requirements into architecture, tested code and deployment-ready applications — with human approval at every critical decision.</p><div class="actions">${btn('Explore the platform →','product')}${btn('Open interactive demo','dashboard','')} </div><div class="tags"><span class="tag">Requirements-first</span><span class="tag">Evidence-backed verification</span><span class="tag">Controlled deployments</span></div></div><div class="mock"><div class="mock-head"><b>◈ &nbsp;Delivery command center</b><div class="dots"><i></i><i></i><i></i></div></div><div class="mock-body"><div class="row"><div><small class="muted">ACTIVE PROJECT</small><h3>Customer Support AI Assistant</h3></div>${badge('On track')}</div><div class="metric-grid"><div class="metric"><small>Requirements</small><strong>24/24</strong><small>Traced</small></div><div class="metric"><small>Checks</small><strong>118</strong><small>Passing</small></div><div class="metric"><small>Progress</small><strong>76%</strong><small>To release</small></div></div><p class="muted">Delivery lifecycle</p><div class="track"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i></i><i></i></div><div class="row"><small class="muted">Requirements → Design → Build → Verify → Deploy</small><span class="pill gold">1 approval pending</span></div><div class="panel" style="margin-bottom:0"><div class="row"><div><b>Verification harness</b><p style="margin:4px 0">Independent CI checks completed</p></div>${badge('Passed')}</div></div></div></div></div></section><section class="section"><div class="container"><div class="section-head"><div class="eyebrow">ONE CONNECTED PLATFORM</div><h2>More than an AI <em>coding tool.</em></h2><p>Manage the complete engineering lifecycle, from a rough client brief to an auditable production release.</p></div><div class="cards">${card('◇','Discover & define','Turn project briefs into structured requirements, questions, acceptance criteria and scope baselines.')}${card('⌘','Architect & plan','Compare designs, generate architecture decisions, model integrations and plan tasks.')}${card('⌁','Build & verify','Run coding agents in isolated sandboxes and independently validate their outputs.')}${card('⇧','Release safely','Review deployment readiness, stage releases and require production authorization.')}${card('◎','Operate & repair','Correlate incidents, propose fixes and verify regression tests before release.')}${card('▤','Prove every decision','Maintain traceability, evidence, approvals, budgets and handoff documentation.')}</div></div></section><section class="section alt"><div class="container"><div class="section-head"><div class="eyebrow">THE FORGEFLOW LIFECYCLE</div><h2>Six steps. One delivery flow.</h2></div><div class="flow">${['Intake','Requirements','Architecture','Build','Verification','Release'].map((x,i)=>`<div class="card"><span class="num">0${i+1}</span><h3>${x}</h3><p>${['Understand the work','Agree on the scope','Choose the design','Implement in isolation','Prove the result','Approve and ship'][i]}</p></div>`).join('')}</div></div></section><section class="section"><div class="container"><div class="callout"><div class="eyebrow">BUILT FOR ACCOUNTABLE AUTOMATION</div><h2>Autonomy where it helps.<br><em>Control where it matters.</em></h2><p>Agents can research, plan, implement and test. Humans authorize commitments, material architecture decisions and production changes.</p><div class="actions">${btn('See security & governance','security')}${btn('View workflow','how','')}</div></div></div></section>`}
function product(){let features=[['Requirements discovery','Extract requirements, identify ambiguities and generate client clarification queues.'],['Architecture decision harness','Evaluate alternatives, capture ADRs, threat models and cost trade-offs.'],['Integration intelligence','Discover API auth, rate limits, webhooks and contract-test requirements.'],['Agent orchestration','Run bounded, versioned agent tasks with tool permissions and cost limits.'],['Independent acceptance','Map approved requirements to independently executed tests and evidence.'],['Secure execution','Use ephemeral isolated environments, protected Git workflows and clean CI.'],['Deployment readiness','Prepare staging, environment checks, migrations, rollback and approval gates.'],['Incident reproduction','Correlate telemetry, reproduce bugs and prepare verified patches.'],['Delivery governance','Track milestones, costs, changes, client signoff and handoff artifacts.']];return `${pageHero('PLATFORM','An engineering operating system.','ForgeFlow combines business intake, engineering intelligence and secure execution in a supervised software delivery workspace.')}<section class="section"><div class="container"><div class="cards">${features.map((f,i)=>card(['◇','⬡','↔','⌘','✓','▣','⇧','◎','▤'][i],f[0],f[1])).join('')}</div></div></section><section class="section alt"><div class="container"><div class="split"><div><div class="eyebrow">THREE PLANES</div><h2>Designed for real delivery.</h2><p>Business control plane: opportunities, proposals, scope and approvals.</p><p>Engineering control plane: requirements, architecture, harnesses, policies and artifacts.</p><p>Execution plane: isolated coding environments, CI, staging and monitored releases.</p>${btn('Explore demo workspace','dashboard')}</div><div class="panel"><div class="code">Business Control Plane\n      ↓ approved scope\nEngineering Control Plane\n      ↓ bounded tasks\nSandbox → Git PR → Independent CI\n      ↓ release approval\nStaging → Production → Monitoring</div></div></div></div></section>`}
function how(){return `${pageHero('HOW IT WORKS','From brief to verified release.','A connected workflow that keeps AI execution bounded and important business decisions in human hands.')}<section class="section"><div class="container"><div class="steps">${[['01','Import project brief','Paste a job posting or client requirements. ForgeFlow structures scope and highlights unknowns.'],['02','Approve requirements','Review assumptions, clarify business rules and freeze acceptance criteria.'],['03','Review architecture','Compare alternatives, approve design decisions and generate a dependency-aware task plan.'],['04','Build in isolation','Coding agents work in disposable environments and submit versioned changes.'],['05','Verify independently','Separate CI and acceptance checks validate the exact candidate commit.'],['06','Release with approval','Inspect readiness evidence, approve production and monitor the delivered system.']].map(x=>`<div class="card"><div class="eyebrow">STEP ${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></div></section>`}
function solutions(){return `${pageHero('SOLUTIONS','Built for teams that ship.','Start with a focused software stack, then expand as delivery quality and repeatability are proven.')}<section class="section"><div class="container"><div class="cards">${card('⌘','Independent engineers','Qualify work, structure client requirements and deliver with repeatable workflows.')}${card('▥','Development agencies','Coordinate multiple projects, engineering approvals and evidence-backed handoffs.')}${card('✦','Startup teams','Turn scoped ideas into prototypes and production candidates with clear quality gates.')}${card('↔','API & integrations','Deliver FastAPI services, PostgreSQL backends and selected external integrations.')}${card('◎','AI / RAG applications','Build document assistants and retrieval systems with source-aware acceptance tests.')}${card('✓','QA automation','Generate test plans, contract tests, regression suites and verification evidence.')}</div></div></section>`}
function security(){return `${pageHero('TRUST & GOVERNANCE','Safety is part of the workflow.','ForgeFlow is designed around least privilege, verifiable evidence and explicit approvals — not unchecked agent autonomy.')}<section class="section"><div class="container"><div class="cards">${card('▣','Isolated execution','Disposable VM or microVM sandboxes for untrusted code; no direct production credentials.')}${card('✓','Independent verification','Coding agents cannot certify their own work; clean CI reruns required checks.')}${card('♧','Human approval gates','Contracts, consequential scope changes and production deployments require authorization.')}${card('◈','Evidence & provenance','Capture source references, hashes, commits, tests, approvals and release digests.')}${card('⊘','Scoped permissions','Tool allowlists, short-lived credentials, network restrictions and audit events.')}${card('◉','Tenant-ready architecture','Plan for workspace isolation, retention policies, quotas and access control.')}</div><div class="notice" style="margin-top:25px">This is a product-design prototype. These controls are architectural requirements, not claims that a production service or certification already exists.</div></div></section>`}
function pricing(){return `${pageHero('PRICING','Start focused. Scale with proof.','Commercial packaging concepts for a future SaaS launch. Pricing has not been finalized.')}<section class="section"><div class="container"><div class="row wrap" style="margin-bottom:22px"><p>Choose a proposed billing cadence</p><div class="tabs"><button id="monthly" onclick="pricePeriod('month')">Monthly</button><button id="annual" onclick="pricePeriod('year')">Annual</button></div></div><div class="pricegrid">${[['Solo','For independent builders','Opportunity intake, architecture and limited verified agent runs.'],['Studio','For agencies and small teams','Shared workspaces, delivery governance, integrations and expanded execution.'],['Enterprise','For regulated or complex organizations','Advanced policy, audit, identity, support and deployment controls.']].map((x,i)=>`<div class="price ${i===1?'featured':''}"><div class="eyebrow">${i===1?'POPULAR CONCEPT':'PLAN CONCEPT'}</div><h2>${x[0]}</h2><p>${x[1]}</p><div class="amount">${i===2?'Custom':'TBD'}<small class="muted"> ${i===2?'':'/ '+state.period}</small></div><ul><li>Human approval workflow</li><li>Traceable engineering artifacts</li><li>${x[2]}</li><li>Usage-based execution limits</li></ul>${btn(i===2?'Contact us':'Join interest list','contact',i===1?'primary':'')}</div>`).join('')}</div><div class="notice" style="margin-top:20px">No live subscriptions, checkout or finalized prices are represented in this demo. Model, sandbox and cloud execution may be billed separately in a future offering.</div></div></section>`}
function docs(){return `${pageHero('DOCUMENTATION','Build with clarity.','An overview of the planned platform contracts, architecture and integration model.')}<section class="section"><div class="container"><div class="cards">${card('◇','Getting started','Create a project, import a brief and run the requirements discovery workflow.')}${card('⌘','API concepts','Projects, artifacts, agent runs, approvals, verification and releases.')}${card('▤','Artifact contracts','Typed, versioned requirements, architecture, task and evidence objects.')}${card('↔','Integration adapters','GitHub, selected model providers, cloud deployments and external APIs.')}${card('✓','Verification gates','Traceability, independent CI, security scans and acceptance evidence.')}${card('♧','Policy & approval','Role-scoped permissions and approval bound to immutable artifact versions.')}</div><div class="panel"><h3>Illustrative API surface</h3><div class="code">POST /api/v1/projects\nPOST /api/v1/projects/{id}/intake/analyze\nPOST /api/v1/projects/{id}/architecture-runs\nPOST /api/v1/tasks/{id}/execute\nGET  /api/v1/tasks/{id}/evidence\nPOST /api/v1/approvals/{id}/decision\nPOST /api/v1/releases</div><p>These are proposed API contracts from the design blueprint, not active endpoints.</p></div></div></section>`}
function about(){return `${pageHero('ABOUT FORGEFLOW','Software delivery, reimagined.','Our product vision: reduce repetitive engineering effort without losing accountability for correctness, security or business intent.')}<section class="section"><div class="container prose"><h2>Why ForgeFlow?</h2><p>AI makes code generation faster, but a complete software project still requires requirements discovery, architectural decisions, integration access, verification, deployment and ongoing support. ForgeFlow is designed to connect these activities through specialized harnesses.</p><h2>Our principles</h2><p><b>Evidence over confidence.</b> Every important engineering decision should be traceable to approved requirements and verification results.</p><p><b>Human control over irreversible decisions.</b> Agents assist with work; people authorize business commitments and production impact.</p><p><b>Practical scope first.</b> Validate repeatable delivery on a constrained stack before expanding into a general SaaS platform.</p><div class="notice">ForgeFlow is currently presented as a planned product and interactive website concept.</div></div></section>`}
function contact(){return `${pageHero('CONTACT','Talk to ForgeFlow.','Interested in an early pilot, agency workflow or product partnership? Share a few details.')}<section class="section"><div class="container"><form class="formbox" onsubmit="submitContact(event)"><div class="field"><label>Name</label><input name="name" required placeholder="Your name"></div><div class="field"><label>Email</label><input name="email" type="email" required placeholder="you@company.com"></div><div class="field"><label>What describes you?</label><select name="role"><option>Independent developer</option><option>Agency</option><option>Startup</option><option>Enterprise team</option></select></div><div class="field"><label>What would you like to build?</label><textarea name="message" required placeholder="Tell us about your use case"></textarea></div><button class="btn primary" type="submit">Save inquiry locally →</button><p class="muted">Demo only. This form does not send messages or store them on a server.</p></form></div></section>`}
function auth(kind){return `${pageHero(kind==='login'?'WORKSPACE ACCESS':'EARLY ACCESS',kind==='login'?'Welcome back.':'Create your ForgeFlow workspace.',kind==='login'?'Sign in to review projects and approvals.':'Explore the supervised software delivery workflow.')}<section class="section"><div class="container"><form class="formbox" onsubmit="event.preventDefault();toast('Demo mode: opening sample workspace');go('dashboard')"><div class="field"><label>Work email</label><input type="email" required placeholder="you@company.com"></div><div class="field"><label>Password</label><input type="password" required placeholder="••••••••" minlength="6"></div><button class="btn primary" type="submit">${kind==='login'?'Open demo workspace':'Explore demo workspace'} →</button><p>Authentication is not connected. This button opens a sample workspace.</p><p>${kind==='login'?'<a class="link" href="#/signup">Need an account?</a>':'<a class="link" href="#/login">Already have an account?</a>'}</p></form></div></section>`}
function help(){return `${pageHero('HELP CENTER','Answers for the journey.','Learn how the proposed ForgeFlow workflow handles requirements, engineering execution and approvals.')}<section class="section"><div class="container prose">${[['Is ForgeFlow a live SaaS product?','Not yet. This website is an interactive product and design prototype.'],['Can agents deploy directly to production?','The planned workflow requires an authorized human to approve production deployment against an immutable artifact.'],['Which stacks are planned first?','Python/FastAPI, PostgreSQL, React/TypeScript, Docker, GitHub Actions and selected AI/RAG integrations.'],['Can I use ForgeFlow with Upwork?','The planned intake can evaluate permitted job information. Proposal submission, contracts and client commitments stay human-controlled and must comply with marketplace rules.'],['How does ForgeFlow test generated code?','An independent verification harness maps requirements to acceptance criteria and runs clean CI and other checks on the candidate commit.'],['Does the demo save my changes?','Demo interactions are local to the current browser session; they are not persisted or sent to a server.']].map(x=>`<details class="faq"><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</div></section>`}
function appLayout(r,content){return `${header(r)}<div class="app-layout"><aside class="sidebar">${menuGroups.map(g=>`<div class="group">${g[0]}</div>${g[1].map(k=>`<a class="${r===k?'active':''}" href="#/${k}">${routes[k]}</a>`).join('')}`).join('')}</aside><main class="appmain">${content}</main></div>`}function appHead(k,desc,action=''){return `<div class="row wrap"><div><div class="eyebrow">FORGEFLOW / DEMO WORKSPACE</div><h1>${k}</h1><p class="sub">${desc}</p></div>${action}</div>`}function stats(items){return `<div class="statgrid">${items.map(x=>`<div class="stat"><div class="caption">${x[0]}</div><div class="big">${x[1]}</div><div class="caption">${x[2]||''}</div></div>`).join('')}</div>`}function projRows(){return [...projects,...state.newProjects].filter(p=>state.filter==='All'||p.stage===state.filter).map(p=>`<tr><td><a class="link" href="#/requirements" onclick="state.project='${p.name}'">${p.name}</a><div class="muted">${p.type}</div></td><td>${badge(p.stage)}</td><td style="min-width:120px"><div class="progress"><i style="width:${p.progress}%"></i></div><small>${p.progress}%</small></td><td>${badge(p.health)}</td><td><button class="btn small" onclick="state.project='${p.name}';go('tasks')">Open →</button></td></tr>`).join('')}function table(head,body){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`}
function dashboard(){return `${appHead('Delivery overview','Your projects, approvals and engineering activity in one place.',btn('+ New project','newproject'))}${stats([['Active projects',String(3+state.newProjects.length),'Across demo workspace'],['Verification pass rate','96.4%','Illustrative'],['Pending approvals',String(Math.max(0,2-state.approved.length)),'Action required'],['Agent runs','42','Sample data']])}<div class="split"><div class="panel"><div class="row"><h3>Project portfolio</h3><a class="link" href="#/projects">View all →</a></div>${table(['Project','Stage','Progress','Health',''],projRows())}</div><div class="panel"><h3>Action center</h3><div class="timeline"><div class="event"><b>Architecture review</b><p>Inventory Sync API requires a design decision.</p><button class="btn small" onclick="go('approvals')">Review</button></div><div class="event"><b>Staging release ready</b><p>Client Portal awaits release authorization.</p><button class="btn small" onclick="go('releases')">Inspect</button></div><div class="event"><b>Verification passed</b><small>118 checks on the sample support assistant.</small></div></div></div></div><div class="panel"><div class="row"><h3>Recent agent activity</h3><a href="#/agents" class="link">All runs →</a></div>${table(['Agent','Project','Task','Status'],[['Requirements Analyst','Inventory Sync API','Clarification draft','Complete'],['Verification Harness','Support AI Assistant','Acceptance suite','Passed'],['Architecture Agent','Inventory Sync API','Architecture alternatives','Review']].map(x=>`<tr>${x.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''))}</div>`}
function projectPage(){return `${appHead('Projects','Track active delivery, milestones and engineering evidence.',btn('+ New project','newproject'))}<div class="row wrap"><div class="tabs">${['All','Verification','Architecture','Staging','Requirements'].map(s=>`<button class="${state.filter===s?'active':''}" onclick="state.filter='${s}';render()">${s}</button>`).join('')}</div><input class="search" style="max-width:240px" placeholder="Search projects" oninput="filterTable(this.value)"></div><div class="panel">${table(['Project','Stage','Progress','Health','Action'],projRows())}</div>`}function newProject(){return `${appHead('New project','Capture the brief and begin a supervised discovery workflow.')}<form class="formbox" onsubmit="createProject(event)"><div class="field"><label>Project name</label><input name="name" required placeholder="e.g. Customer analytics dashboard"></div><div class="field"><label>Project category</label><select name="type"><option>API / Backend</option><option>AI / RAG Application</option><option>Web Application</option><option>QA Automation</option><option>Integration</option></select></div><div class="field"><label>Project brief</label><textarea name="brief" required placeholder="Describe the problem, expected users, data sources, integrations and acceptance goals."></textarea></div><div class="field"><label>Preferred technology</label><select name="stack"><option>FastAPI + PostgreSQL + React</option><option>FastAPI + PostgreSQL</option><option>React + TypeScript</option><option>Not decided</option></select></div><div class="notice">In the real product, the next step would create an immutable intake artifact and queue a requirements analysis. This demo creates a local project card only.</div><div class="actions"><button class="btn primary" type="submit">Create demo project →</button>${btn('Cancel','projects','')}</div></form>`}
function opportunitiesPage(){return `${appHead('Opportunity intelligence','Qualify permitted freelance leads before any human-approved proposal.')} ${stats([['Qualified leads','12','Sample pipeline'],['High-fit leads','4','Fit ≥ 85'],['Draft proposals','3','Not submitted'],['Contracts','1','Human-approved example']])}<div class="panel"><h3>Opportunity shortlist</h3>${table(['Opportunity','Budget (illustrative)','Fit score','Priority','Action'],opportunities.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}/100</td><td>${badge(x[3])}</td><td><button class="btn small" onclick="toast('Proposal preview only. No marketplace action was taken.')">Draft proposal</button></td></tr>`).join(''))}</div><div class="notice">Sample leads are fictional and are not live Upwork listings. Marketplace submission and contracts are outside the autonomous agent scope.</div>`}
function requirements(){return `${appHead('Requirements & scope',`Project: ${state.project}`,btn('Review architecture','architecture'))}${stats([['Requirements','24','Approved baseline v3'],['Acceptance criteria','38','Mapped'],['Open clarifications','2','Needs human input'],['Traceability','100%','Illustrative']])}<div class="split"><div class="panel"><h3>Requirements baseline</h3>${table(['ID','Requirement','Priority','State'],[['FR-001','Upload knowledge documents','Must','Approved'],['FR-002','Answer with source citations','Must','Approved'],['FR-014','Enforce tenant-isolated retrieval','Critical','Approved'],['NFR-002','P95 API latency under target','High','Review']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${badge(x[2])}</td><td>${badge(x[3])}</td></tr>`).join(''))}</div><div class="panel"><h3>Clarification queue</h3><p><b>Q1.</b> Should administrators see all workspace documents?</p><p><b>Q2.</b> What retention period applies to uploaded documents?</p><textarea class="search" id="clarification" placeholder="Write a clarification or decision..." style="height:90px"></textarea><div class="actions"><button class="btn primary small" onclick="saveNote('clarification')">Save local note</button></div></div></div>`}
function architecture(){return `${appHead('Architecture studio',`Project: ${state.project}`,btn('Open task board','tasks'))}<div class="tabs">${['Summary','Alternatives','Decisions','Threat model'].map(t=>`<button class="${state.tab===t?'active':''}" onclick="state.tab='${t}';render()">${t}</button>`).join('')}</div><div class="split"><div class="panel"><h3>${state.tab}</h3>${state.tab==='Summary'?`<div class="code">React Web App\n       ↓ HTTPS\nFastAPI Backend ─── PostgreSQL\n       ↓\nDocument Worker ─── Object Storage\n       ↓\nEmbedding Service → Vector Search\n       ↓\nAuthorized CRM API</div><p>Illustrative architecture, not a deployed system.</p>`:state.tab==='Alternatives'?`<p><b>Option A:</b> Modular monolith — lower initial operational complexity.</p><p><b>Option B:</b> Distributed services — stronger isolation, higher coordination overhead.</p><p><b>Recommended:</b> Modular monolith for MVP, subject to review.</p>`:state.tab==='Decisions'?`<p><b>ADR-007:</b> Enforce tenant-scoped document retrieval.</p><p><b>ADR-008:</b> Use a queue for document ingestion.</p><p><b>ADR-009:</b> Human approval before production release.</p>`:`<p><b>Threats:</b> Cross-tenant data exposure, prompt injection, leaked credentials and untrusted code execution.</p><p><b>Controls:</b> Authorization checks, scoped secrets, isolated sandboxes, independent verification.</p>`}</div><div class="panel"><h3>Design review</h3><p>Architecture package v2 · 9 components · 3 ADRs</p>${badge('Needs human review')}<div class="timeline" style="margin-top:25px"><div class="event"><b>Requirements baseline approved</b><small>Version 3</small></div><div class="event"><b>Architecture alternatives generated</b><small>Version 2</small></div><div class="event"><b>Awaiting design decision</b><small>Approval required</small></div></div>${btn('Review approval','approvals')}</div></div>`}
function agents(){return `${appHead('Agent runs','Track bounded execution, evidence, retries and cost.',`<button class="btn primary" onclick="state.demoRuns++;toast('Simulated agent run added');render()">+ Simulate agent run</button>`)}${stats([['Total runs',String(42+state.demoRuns),'Demo data'],['Succeeded','39','Sample history'],['Human interrupts','2','Approval gates'],['Retries','1','Bounded loop']])}<div class="panel">${table(['Run','Agent','Task','Duration','Cost','Status'],[['RUN-042','Verification Harness','Acceptance suite','3m 18s','$0.84','Passed'],['RUN-041','Coding Agent','OAuth token refresh','12m 04s','$2.17','Complete'],['RUN-040','Architecture Agent','Design options','2m 47s','$0.63','Review'],...Array.from({length:state.demoRuns},(_,i)=>['SIM-'+(i+1),'Requirements Analyst','Demo analysis','—','$0.00','Simulated'])].map(x=>`<tr>${x.slice(0,5).map(v=>`<td>${v}</td>`).join('')}<td>${badge(x[5])}</td></tr>`).join(''))}</div><div class="notice">Simulated runs do not execute models, tools, code or external services.</div>`}
function tasks(){return `${appHead('Delivery board',`Project: ${state.project}`,btn('View verification','verification'))}<div class="kanban">${[['Backlog',['CRM webhook retry','Audit log export']],['Ready',['OAuth refresh endpoint','Tenant boundary tests']],['In progress',['Document ingestion worker']],['Verified',['Upload API','Citation formatting','Rate limiting']]].map(c=>`<div class="column"><div class="row"><b>${c[0]}</b><span class="pill">${c[1].length}</span></div>${c[1].map((t,i)=>`<div class="task"><b>${t}</b><p style="font-size:11px">${['FR-014','TASK-042','NFR-002'][i%3]} · ${i%2?'Medium':'High'} priority</p><button class="btn small" onclick="toast('Task detail preview: ${t}')">Details →</button></div>`).join('')}</div>`).join('')}</div><div class="panel"><h3>Workflow policy</h3><p>Each task is bound to an approved architecture version, requirement IDs, a pinned repository commit and independent acceptance checks.</p></div>`}
function verification(){return `${appHead('Verification center','Independent tests and evidence tied to candidate commits.')}${stats([['Checks passed','118','Of 121'],['Critical findings','0','Release blocker target'],['Traceability','100%','Mandatory scope'],['Candidate','def456','Sample commit']])}<div class="panel"><h3>Quality gates</h3>${table(['Gate','Evidence','Result'],[['Unit tests','84 passing tests','Passed'],['Integration tests','18 passing tests','Passed'],['Contract tests','16 passing tests','Passed'],['Security scans','No critical findings','Passed'],['Acceptance criteria','3 nonblocking scenarios under review','Review'],['Production approval','Not yet requested','Pending']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${badge(x[2])}</td></tr>`).join(''))}</div><div class="notice">All results on this screen are illustrative. The demo does not run CI or security scanning.</div>`}
function integrations(){return `${appHead('Integrations','Inspect access readiness and API contract requirements.',btn('View documentation','docs',''))}<div class="cards">${[['GitHub','Repository, branches and CI','Connected (demo)'],['PostgreSQL','Application persistence','Ready (demo)'],['CRM API','OAuth scopes and webhook contracts','Needs access'],['Object storage','Document artifacts and versioning','Planned'],['Model provider','Structured outputs and cost budgets','Planned'],['Cloud deployment','Staging and release adapters','Needs access']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p>${badge(x[2])}<div class="actions"><button class="btn small" onclick="toast('Integration settings are a design preview; no connection is made.')">Configure</button></div></div>`).join('')}</div><div class="panel"><h3>Access checklist</h3><p>Confirm provider, API version, least-privilege scopes, sandbox environment, rate limits, retries, webhooks and authorized test evidence before marking an integration ready.</p></div>`}
function releases(){return `${appHead('Deployments & releases','Stage immutable artifacts and require approval before production promotion.')}${stats([['Environment','Staging','Sample'],['Candidate','v0.8.2','Digest pinned'],['Readiness','5 / 6','Gates passed'],['Rollback','Prepared','Plan available']])}<div class="panel"><h3>Release pipeline</h3><div class="flow">${['Build','Independent CI','Staging','Acceptance','Approval','Production'].map((x,i)=>`<div class="card" style="padding:12px"><b>${x}</b><p>${badge(i<4?'Passed':i===4?'Pending':'Blocked')}</p></div>`).join('')}</div></div><div class="split"><div class="panel"><h3>Release candidate</h3><p><b>Version:</b> v0.8.2</p><p><b>Artifact:</b> sha256:sample-digest</p><p><b>Rollback:</b> v0.8.1</p><p><b>Checks:</b> staging smoke and acceptance evidence</p></div><div class="panel"><h3>Production gate</h3><p>Production promotion is blocked until an authorized reviewer approves the exact immutable release artifact.</p>${btn('Review approvals','approvals')}</div></div>`}
function monitoring(){return `${appHead('Monitoring & incidents','Observe delivered systems and prepare verified repairs.')}${stats([['System status','Healthy','Sample telemetry'],['Availability','99.9%','Illustrative'],['Open incidents','1','Low severity'],['Repair PRs','2','Awaiting review']])}<div class="split"><div class="panel"><h3>Service health</h3>${[['API availability',99],['Request success',97],['Worker processing',92],['Queue health',89]].map(x=>`<p>${x[0]} <span style="float:right">${x[1]}%</span></p><div class="progress"><i style="width:${x[1]}%"></i></div>`).join('')}</div><div class="panel"><h3>Incident queue</h3><b>INC-014 · CRM webhook delay</b><p>Suspected third-party rate limiting. Reproduction and contract checks required before patch proposal.</p>${badge('Needs review')}<div class="actions"><button class="btn small" onclick="toast('Incident investigation is illustrative only.')">Inspect incident</button></div></div></div>`}
function approvals(){let arr=[['APR-104','Architecture decision','Inventory Sync API','High'],['APR-105','Production release','Client Portal','Critical']];return `${appHead('Approvals','Human decisions for architecture, commitments and production changes.')}${stats([['Pending',String(arr.length-state.approved.length),'Awaiting decision'],['Approved',String(state.approved.length),'This session'],['Rejected','0','This session'],['Policy','Human-gated','Production actions']])}<div class="panel">${table(['ID','Action','Project','Risk','Status','Decision'],arr.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${badge(x[3])}</td><td>${badge(state.approved.includes(x[0])?'Approved':'Pending')}</td><td>${state.approved.includes(x[0])?'Decision recorded':`<button class="btn small" onclick="approve('${x[0]}')">Approve demo</button>`}</td></tr>`).join(''))}</div><div class="notice">Approving here only changes the local UI. No production action, real authorization or external API call occurs.</div>`}
function artifacts(){return `${appHead('Artifact registry','Versioned engineering outputs, source references and approval state.')}<div class="panel">${table(['Artifact','Version','Digest','Status'],[['RequirementBaseline','v3','sha256:7a3…','Approved'],['ArchitecturePackage','v2','sha256:84b…','Review'],['TaskGraph','v2','sha256:1c2…','Approved'],['VerificationReport','v7','sha256:6e4…','Passed'],['DeploymentManifest','v1','sha256:9d1…','Pending']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><code>${x[2]}</code></td><td>${badge(x[3])}</td></tr>`).join(''))}</div><div class="notice">Digests are abbreviated sample placeholders, not cryptographically verified artifacts.</div>`}
function costs(){return `${appHead('Costs & usage','Measure agent execution and delivery economics.')}${stats([['Model usage','$31.42','Illustrative period'],['Sandbox compute','$14.80','Illustrative period'],['Storage / CI','$8.25','Illustrative period'],['Total','$54.47','Sample, not billed']])}<div class="panel"><h3>Usage by workstream</h3>${[['Coding and repair',55],['Requirements and architecture',23],['Verification',15],['Other',7]].map(x=>`<div class="row"><p>${x[0]}</p><b>${x[1]}%</b></div><div class="progress"><i style="width:${x[1]}%"></i></div>`).join('')}</div><div class="notice">No payments, metering or billing are connected. All values are sample data.</div>`}
function settings(){return `${appHead('Workspace settings','Configure preferences and planned engineering policies.')}<div class="split"><div class="panel"><h3>Workspace</h3><div class="field"><label>Workspace name</label><input value="ForgeFlow Demo Workspace"></div><div class="field"><label>Default stack</label><select><option>FastAPI + PostgreSQL + React</option><option>FastAPI + PostgreSQL</option></select></div><button class="btn primary small" onclick="toast('Demo settings saved for display only')">Save preferences</button></div><div class="panel"><h3>Engineering guardrails</h3>${[['Production deployments require approval','Enabled'],['Agent network policy','Restricted'],['Max automatic repair attempts','3'],['Independent CI','Required']].map(x=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${x[0]}</span>${badge(x[1])}</div>`).join('')}</div></div>`}
function toast(t){let old=document.querySelector('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}function pricePeriod(p){state.period=p;render()}function filterTable(q){document.querySelectorAll('tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}function approve(id){if(!state.approved.includes(id))state.approved.push(id);toast('Demo approval recorded locally');render()}function saveNote(id){let val=document.getElementById(id).value;if(!val.trim())return toast('Enter a note first');state.requests.push(val);toast('Note saved in this demo session');document.getElementById(id).value=''}function createProject(e){e.preventDefault();let f=new FormData(e.target);state.newProjects.push({name:String(f.get('name')).replace(/[<>]/g,''),type:String(f.get('type')),stage:'Requirements',progress:5,health:'Needs review'});state.project=String(f.get('name'));toast('Demo project created locally');go('projects')}function submitContact(e){e.preventDefault();state.contact.push(Object.fromEntries(new FormData(e.target)));e.target.reset();toast('Inquiry saved locally only. No email was sent.')}function render(){let r=current();if(!routes[r])r='home';let pub={home,product,how,solutions,security,pricing,docs,about,contact,login:()=>auth('login'),signup:()=>auth('signup'),help};let app={dashboard,projects:projectPage,newproject:newProject,opportunities:opportunitiesPage,requirements,architecture,agents,tasks,verification,integrations,releases,monitoring,approvals,artifacts,costs,settings};document.title=`${routes[r]} | ForgeFlow`;document.getElementById('root').innerHTML=appRoutes.includes(r)?appLayout(r,app[r]()):publicLayout(r,pub[r]());if(r==='pricing'){let b=document.getElementById(state.period==='month'?'monthly':'annual');if(b)b.classList.add('active')}}window.addEventListener('hashchange',render);render();
</script></body></html>
