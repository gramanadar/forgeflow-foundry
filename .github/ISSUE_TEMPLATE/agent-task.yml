name: Approved AI engineering task
about: Engineering task eligible for explicit approval
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What needs to be changed and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable outcomes, including failure cases
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Scope and constraints
      description: Files, interfaces, dependencies and forbidden changes
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Tests and evidence required
    validations:
      required: true
