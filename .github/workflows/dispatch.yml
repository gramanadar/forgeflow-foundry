name: ForgeFlow Foundry Dispatch
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect selection without launching Cursor'
        type: boolean
        default: true
# Add a schedule ONLY after live smoke test and safety review.
permissions:
  contents: read
  issues: write
concurrency:
  group: foundry-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FOUNDRY_ENABLED: ${{ vars.FOUNDRY_ENABLED }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # github.event.inputs values are strings ("true" / "false"). The typed
      # inputs.dry_run boolean has no documented env-string encoding.
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dispatch one task
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: python -m foundry.dispatcher
